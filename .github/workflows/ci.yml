name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  probar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Tests (los que no necesitan base de datos)
        run: npm run test:unit
      - name: Verificar que la API arranca
        env:
          PORT: 3999
          JWT_SECRET: ci-secreto-de-prueba-solo-para-arrancar
        run: |
          node src/server.js &
          pid=$!
          sleep 3
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3999/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3999/clientes)" = "401"
          kill $pid
